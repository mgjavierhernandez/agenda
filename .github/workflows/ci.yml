name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate --workspace=@agenda/api
      - run: npm run typecheck

  test:
    name: Unit Tests (API + Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate --workspace=@agenda/api
      - run: npm test

  api-e2e:
    name: API E2E (Jest, runInBand)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agenda
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: agenda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # e2e specs read DATABASE_URL implicitly via PrismaService (PrismaModule).
      DATABASE_URL: postgresql://agenda:test_password@localhost:5432/agenda_test?schema=public
      JWT_ACCESS_SECRET: test-jwt-access-secret-minimum-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate --workspace=@agenda/api
      # Production-compatible migration apply (never `migrate dev`).
      - working-directory: apps/api
        run: npx prisma migrate deploy
      # Seed the shared data used by the Jest e2e specs (login users, roles,
      # permissions, demo institution). `migrate deploy` does NOT auto-seed.
      - working-directory: apps/api
        run: npx ts-node prisma/seed.ts
      # Reproducible: run e2e serially to avoid shared-DB / argon2 contention.
      - working-directory: apps/api
        run: npx jest --config test/jest-e2e.json --runInBand

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate --workspace=@agenda/api
      - run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.prod.yml build api
        env:
          POSTGRES_PASSWORD: ci-build-only
          JWT_ACCESS_SECRET: ci-build-only-not-a-real-secret-min-len
      - run: docker compose -f docker-compose.prod.yml build web
        env:
          POSTGRES_PASSWORD: ci-build-only
          JWT_ACCESS_SECRET: ci-build-only-not-a-real-secret-min-len
      # Verify a valid compose config (no secret files leak into build context).
      # Provide the production-required vars (never shipped as defaults) just so
      # `docker compose config` can fully interpolate.
      - run: docker compose -f docker-compose.prod.yml config --quiet
        env:
          POSTGRES_PASSWORD: verify-only-not-a-secret
          JWT_ACCESS_SECRET: verify-only-not-a-secret-ci-min-length

  e2e:
    name: E2E Tests (Playwright, Smoke)
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agenda
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: agenda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Matches apps/api/.env DEFAULTS_DB contract; PrismaModule reads this.
      DATABASE_URL: postgresql://agenda:test_password@localhost:5432/agenda_test?schema=public
      NODE_ENV: test
      JWT_ACCESS_SECRET: test-jwt-access-secret-minimum-32-characters-long
      CORS_ORIGIN: http://localhost:5173
      E2E_EMAIL: admin@demo-school.dev
      E2E_PASSWORD: Demo1234!
      E2E_API_URL: http://localhost:3000/api/v1
      E2E_BASE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate --workspace=@agenda/api
      - working-directory: apps/api
        run: npx prisma migrate deploy
      # Playwright specs log in with seed accounts (admin@demo-school.dev) so
      # the shared seed data must exist.
      - working-directory: apps/api
        run: npx ts-node prisma/seed.ts
      - run: npx playwright install --with-deps chromium
      # GitHub Actions runs each `run` step in a fresh shell, so background
      # processes (dev servers) must be started AND consumed within a single
      # step or they are terminated before the test step runs.
      - name: Run Playwright E2E (single step so servers stay alive)
        shell: bash
        run: |
          set -e
          npm run dev:api &
          api_pid=$!
          npm run dev:web &
          web_pid=$!
          cleanup() { kill $api_pid $web_pid 2>/dev/null || true; }
          trap cleanup EXIT
          npx wait-on http://localhost:3000/api/v1/health http://localhost:5173 --timeout 90000
          npx playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
